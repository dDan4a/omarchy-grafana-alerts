name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/alerts.test.js
      - name: manifest is valid JSON
        run: jq -e '.id and .entryPoints.service and .entryPoints.barWidget' manifest.json
